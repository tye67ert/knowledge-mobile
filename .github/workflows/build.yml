name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet
      - name: Install Flutter SDK
        run: |
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 $GITHUB_WORKSPACE/flutter
          echo "$GITHUB_WORKSPACE/flutter/bin" >> $GITHUB_PATH
          echo "FLET_FLUTTER_SDK_PATH=$GITHUB_WORKSPACE/flutter" >> $GITHUB_ENV
      - name: Accept Android licenses
        run: |
          export PATH="$GITHUB_WORKSPACE/flutter/bin:$PATH"
          yes | flutter doctor --android-licenses
      - name: Build APK
        run: |
          export PATH="$GITHUB_WORKSPACE/flutter/bin:$PATH"
          export FLUTTER_ROOT="$GITHUB_WORKSPACE/flutter"
          export FLET_FLUTTER_SDK_PATH="$GITHUB_WORKSPACE/flutter"
          flet build apk --project main.py --org com.knowledge \
            --android-permissions android.permission.READ_EXTERNAL_STORAGE \
            --android-permissions android.permission.WRITE_EXTERNAL_STORAGE \
            --android-permissions android.permission.MANAGE_EXTERNAL_STORAGE
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-apk
          path: build/apk/*.apk
