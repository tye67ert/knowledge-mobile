name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Flet
        run: pip install flet==0.28.3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'

      - name: Set Flutter SDK path
        run: |
          echo "FLET_FLUTTER_SDK_PATH=${{ env.FLUTTER_ROOT }}" >> $GITHUB_ENV
          echo "FLUTTER_ROOT=${{ env.FLUTTER_ROOT }}" >> $GITHUB_ENV
          echo "${{ env.FLUTTER_ROOT }}/bin" >> $GITHUB_PATH

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Generate Flet project (ignore initial failure)
        run: yes | flet build apk --project main.py --org com.knowledge || true

      - name: Patch settings.gradle
        run: |
          cd build/flutter/android
          cat > settings.gradle <<'EOF'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }
              settings.ext.flutterSdkPath = flutterSdkPath()
              includeBuild("${settings.ext.flutterSdkPath}/packages/flutter_tools/gradle")
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          plugins {
              id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false
              id "com.android.application" version "8.9.1" apply false
              id "org.jetbrains.kotlin.android" version "1.9.24" apply false
          }
          include ":app"
          EOF
          # 确保 build.gradle 中 Kotlin 版本
          sed -i 's/1\.9\.24/1\.9\.24/g; s/2\.0\.0/1\.9\.24/g' build.gradle
          # 添加属性
          echo "android.newDsl=false" >> gradle.properties

      - name: Build APK with Flutter
        run: |
          export PATH="$FLUTTER_ROOT/bin:$PATH"
          cd build/flutter
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-apk
          path: build/flutter/build/app/outputs/flutter-apk/app-release.apk
