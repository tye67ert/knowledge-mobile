name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.86.5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Set Flutter SDK path for Flet
        run: |
          echo "FLET_FLUTTER_SDK_PATH=${{ env.FLUTTER_ROOT }}" >> $GITHUB_ENV
          echo "FLUTTER_ROOT=${{ env.FLUTTER_ROOT }}" >> $GITHUB_ENV

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Generate Flet project (will fail at Gradle, ignore)
        run: |
          flet build apk --project main.py --org com.knowledge || true

      - name: Patch AGP, Kotlin, NDK versions and set SERIOUS_PYTHON_SITE_PACKAGES
        run: |
          cd build/flutter/android
          # 使用 Python 脚本统一替换版本号，避免 sed 遗漏
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = ['settings.gradle', 'build.gradle', 'app/build.gradle']
          for f in files:
              p = Path(f)
              if not p.exists():
                  continue
              content = p.read_text()

              # 升级 AGP 到 8.9.1
              content = re.sub(r'(com\.android\.application["\']\s+version\s+["\'])([^"\']+)(["\'])', r'\g<1>8.9.1\g<3>', content)
              content = re.sub(r'(com\.android\.application["\']\s+version\s+["\'])([^"\']+)(["\'])', r'\g<1>8.9.1\g<3>', content)

              # 升级 Kotlin 到 2.2.0
              content = re.sub(r'(org\.jetbrains\.kotlin\.android["\']\s+version\s+["\'])([^"\']+)(["\'])', r'\g<1>2.2.0\g<3>', content)
              content = re.sub(r'ext\.kotlin_version\s*=\s*["\']([^"\']*)["\']', 'ext.kotlin_version = "2.2.0"', content)

              # 添加 ndkVersion 到 android 块（如果尚未添加）
              if 'ndkVersion' not in content and 'android {' in content:
                  content = content.replace('android {', 'android {\n    ndkVersion "28.2.13676358"')

              p.write_text(content)
              print(f"Patched {f}")
          PY
          # 添加 android.newDsl=false 避免 AGP 9 警告
          echo "android.newDsl=false" >> gradle.properties

          # 查找 site-packages 并设置环境变量
          SITE_PACKAGES=$(find .. -type d -name "site-packages" | head -n 1)
          if [ -z "$SITE_PACKAGES" ]; then
            SITE_PACKAGES=$(find .. -type d -name ".serious_python" | head -n 1)
          fi
          if [ -z "$SITE_PACKAGES" ]; then
            echo "❌ 未找到 site-packages 目录，列出目录内容："
            find .. -maxdepth 4 -type d | grep -i python | head -20
            exit 1
          fi
          echo "✅ 找到 site-packages: $SITE_PACKAGES"
          echo "SERIOUS_PYTHON_SITE_PACKAGES=$SITE_PACKAGES" >> $GITHUB_ENV

      - name: Build APK with Flutter directly
        run: |
          cd build/flutter
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-apk
          path: build/flutter/build/app/outputs/flutter-apk/app-release.apk
