name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Flet
        run: pip install flet==0.28.3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'

      - name: Set environment
        run: |
          echo "FLET_FLUTTER_SDK_PATH=${{ env.FLUTTER_ROOT }}" >> $GITHUB_ENV
          echo "FLUTTER_ROOT=${{ env.FLUTTER_ROOT }}" >> $GITHUB_ENV
          echo "${{ env.FLUTTER_ROOT }}/bin" >> $GITHUB_PATH

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Generate Flet project (ignore initial failure)
        run: |
          yes | flet build apk --project main.py --org com.knowledge || true

      - name: Upgrade Gradle wrapper
        run: |
          WRAPPER_FILE="build/flutter/android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER_FILE" ]; then
            sed -i 's/gradle-8\.7-all\.zip/gradle-8\.11\.1-all\.zip/g' "$WRAPPER_FILE"
            echo "✅ Gradle wrapper 已升级到 8.11.1"
          else
            echo "⚠️ 未找到 gradle-wrapper.properties，尝试其他路径"
            find build -name "gradle-wrapper.properties" -exec sed -i 's/gradle-8\.7-all\.zip/gradle-8\.11\.1-all\.zip/g' {} \;
          fi

      - name: Build APK (final)
        run: |
          cd $GITHUB_WORKSPACE
          yes | flet build apk --project main.py --org com.knowledge

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-apk
          path: build/apk/*.apk
