name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.28.3
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
      - name: Set Flutter SDK path
        run: |
          echo "FLET_FLUTTER_SDK_PATH=${{ env.FLUTTER_ROOT }}" >> $GITHUB_ENV
          echo "FLUTTER_ROOT=${{ env.FLUTTER_ROOT }}" >> $GITHUB_ENV
          echo "${{ env.FLUTTER_ROOT }}/bin" >> $GITHUB_PATH
      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses
      - name: Generate project (ignore failure)
        run: |
          cd $GITHUB_WORKSPACE
          yes | flet build apk --project main.py --org com.knowledge || true
      - name: Add all permissions
        run: |
          MANIFEST="$GITHUB_WORKSPACE/build/flutter/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            PERMS=(
              "android.permission.READ_EXTERNAL_STORAGE"
              "android.permission.WRITE_EXTERNAL_STORAGE"
              "android.permission.MANAGE_EXTERNAL_STORAGE"
              "android.permission.INTERNET"
              "android.permission.ACCESS_NETWORK_STATE"
              "android.permission.ACCESS_WIFI_STATE"
              "android.permission.CHANGE_WIFI_STATE"
              "android.permission.CAMERA"
              "android.permission.RECORD_AUDIO"
              "android.permission.ACCESS_FINE_LOCATION"
              "android.permission.ACCESS_COARSE_LOCATION"
              "android.permission.READ_PHONE_STATE"
              "android.permission.BLUETOOTH"
              "android.permission.BLUETOOTH_ADMIN"
              "android.permission.BLUETOOTH_CONNECT"
              "android.permission.BLUETOOTH_SCAN"
              "android.permission.POST_NOTIFICATIONS"
              "android.permission.VIBRATE"
              "android.permission.WAKE_LOCK"
              "android.permission.REQUEST_INSTALL_PACKAGES"
              "android.permission.FOREGROUND_SERVICE"
            )
            for perm in "${PERMS[@]}"; do
              if ! grep -q "$perm" "$MANIFEST"; then
                sed -i "/<manifest /a\    <uses-permission android:name="$perm" />" "$MANIFEST"
              fi
            done
            echo "✅ 权限已添加"
          else
            echo "❌ 未找到 AndroidManifest.xml"
            exit 1
          fi
      - name: Build APK (final)
        run: |
          cd $GITHUB_WORKSPACE
          yes | flet build apk --project main.py --org com.knowledge
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-apk
          path: build/apk/*.apk
