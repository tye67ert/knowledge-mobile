name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.86.5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Set Flutter SDK path for Flet
        run: |
          echo "FLET_FLUTTER_SDK_PATH=${{ env.FLUTTER_ROOT }}" >> $GITHUB_ENV
          echo "FLUTTER_ROOT=${{ env.FLUTTER_ROOT }}" >> $GITHUB_ENV

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Generate Flet project (will fail at Gradle, ignore)
        run: |
          flet build apk --project main.py --org com.knowledge || true

      - name: Patch AGP and Kotlin versions
        run: |
          cd build/flutter/android
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path('settings.gradle')
          content = settings.read_text()

          # 升级 AGP 版本
          content = re.sub(r'(id\s+["\']com\.android\.application["\']\s+version\s+["\'])([^"\']+)(["\'])', r'\g<1>8.6.0\g<3>', content)

          # 升级 Kotlin 版本
          content = re.sub(r'(id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+["\'])([^"\']+)(["\'])', r'\g<1>2.0.21\g<3>', content)

          settings.write_text(content)
          print("Patched settings.gradle:")
          print(content)

          prop = Path('gradle.properties')
          prop_text = prop.read_text() if prop.exists() else ''
          if 'android.newDsl' not in prop_text:
              prop_text += '\nandroid.newDsl=false\n'
          prop.write_text(prop_text)
          print("Patched gradle.properties:")
          print(prop_text)
          PY

      - name: Build APK with Flutter directly
        run: |
          cd build/flutter
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-apk
          path: build/flutter/build/app/outputs/flutter-apk/app-release.apk
