name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.86.5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Set Flutter SDK path for Flet
        run: |
          echo "FLET_FLUTTER_SDK_PATH=${{ env.FLUTTER_ROOT }}" >> $GITHUB_ENV
          echo "FLUTTER_ROOT=${{ env.FLUTTER_ROOT }}" >> $GITHUB_ENV

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Generate Flet project (will fail at Gradle, ignore)
        run: |
          flet build apk --project main.py --org com.knowledge || true

      - name: Find and set SERIOUS_PYTHON_SITE_PACKAGES
        run: |
          # 查找所有可能的 site-packages 目录
          SITE_PACKAGES=$(find build/flutter -type d -name "site-packages" 2>/dev/null | head -n 1)
          if [ -z "$SITE_PACKAGES" ]; then
            echo "未直接找到 site-packages，尝试查找 .serious_python 目录..."
            SITE_PACKAGES=$(find build/flutter -type d -name ".serious_python" 2>/dev/null | head -n 1)
          fi
          if [ -z "$SITE_PACKAGES" ]; then
            echo "尝试查找其他包含 site-packages 的目录..."
            SITE_PACKAGES=$(find build -type d -name "site-packages" 2>/dev/null | head -n 1)
          fi
          if [ -z "$SITE_PACKAGES" ]; then
            echo "❌ 未找到 site-packages 目录，列出 build/flutter 目录内容以调试："
            find build/flutter -maxdepth 3 -type d | head -50
            exit 1
          fi
          echo "✅ 找到 site-packages: $SITE_PACKAGES"
          echo "SERIOUS_PYTHON_SITE_PACKAGES=$SITE_PACKAGES" >> $GITHUB_ENV

      - name: Build APK with Flutter directly (skip dependency validation)
        run: |
          cd build/flutter
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-apk
          path: build/flutter/build/app/outputs/flutter-apk/app-release.apk
