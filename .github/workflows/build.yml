name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter_version: ['3.44.8', '3.38.3', '3.22.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.86.5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter_version }}
          channel: 'stable'

      - name: Set Flutter SDK path for Flet
        run: |
          echo "FLET_FLUTTER_SDK_PATH=${{ env.FLUTTER_ROOT }}" >> $GITHUB_ENV
          echo "FLUTTER_ROOT=${{ env.FLUTTER_ROOT }}" >> $GITHUB_ENV

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Generate Flet project (ignore initial failure)
        run: |
          flet build apk --project main.py --org com.knowledge || true

      - name: Patch versions and environment
        run: |
          cd build/flutter/android
          # 版本升级
          sed -i 's/8\.3\.1/8\.9\.1/g; s/1\.9\.24/2\.2\.0/g; s/2\.0\.0/2\.2\.0/g' settings.gradle build.gradle app/build.gradle
          # 添加 ndkVersion 到 app/build.gradle
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle')
          content = p.read_text()
          if 'ndkVersion' not in content:
              content = content.replace('android {', 'android {\n    ndkVersion "28.2.13676358"')
          p.write_text(content)
          PY
          echo "android.newDsl=false" >> gradle.properties
          # 设置 SERIOUS_PYTHON_SITE_PACKAGES
          SITE_PACKAGES=$(find .. -type d -name "site-packages" | head -n 1)
          if [ -z "$SITE_PACKAGES" ]; then
            SITE_PACKAGES=$(find .. -type d -name ".serious_python" | head -n 1)
          fi
          if [ -z "$SITE_PACKAGES" ]; then
            echo "❌ 未找到 site-packages"
            exit 1
          fi
          echo "SERIOUS_PYTHON_SITE_PACKAGES=$SITE_PACKAGES" >> $GITHUB_ENV

      - name: Build APK with Flutter
        run: |
          cd build/flutter
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-apk-${{ matrix.flutter_version }}
          path: build/flutter/build/app/outputs/flutter-apk/app-release.apk
