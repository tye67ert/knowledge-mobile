name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.86.5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Set Flutter SDK path for Flet
        run: |
          echo "FLET_FLUTTER_SDK_PATH=${{ env.FLUTTER_ROOT }}" >> $GITHUB_ENV
          echo "FLUTTER_ROOT=${{ env.FLUTTER_ROOT }}" >> $GITHUB_ENV

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Build Flet app (first attempt, ignore failure)
        run: |
          flet build apk --project main.py --org com.knowledge || true

      - name: Patch AGP version
        run: |
          cd build/flutter/android
          sed -i 's/8\.3\.1/8\.6\.0/g' settings.gradle build.gradle

      - name: Build APK manually
        run: |
          cd build/flutter
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-apk
          path: build/flutter/build/app/outputs/flutter-apk/app-release.apk
