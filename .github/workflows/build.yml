name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.86.5

      # 关键：让 Flet 自动安装匹配的 Flutter，并自动确认所有提示
      - name: Generate Flet project (auto-accept Flutter install)
        run: |
          yes | flet build apk --project main.py --org com.knowledge || true

      # 修补生成的 Android 项目文件
      - name: Patch Gradle files and set environment
        run: |
          cd build/flutter/android

          # 使用 Python 一次性替换所有版本并添加必需配置
          python3 - <<'PY'
          import re
          from pathlib import Path

          # 替换 settings.gradle 中的 AGP 和 Kotlin 版本
          settings = Path('settings.gradle')
          content = settings.read_text()
          content = re.sub(r'(id\s+["\']com\.android\.application["\']\s+version\s+["\'])([^"\']+)(["\'])',
                           r'\g<1>8.9.1\g<3>', content)
          content = re.sub(r'(id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+["\'])([^"\']+)(["\'])',
                           r'\g<1>2.2.0\g<3>', content)
          # 如果 plugins 块中没有 Kotlin 插件，则添加
          if 'org.jetbrains.kotlin.android' not in content:
              content = content.replace('plugins {',
                                        'plugins {\n    id "org.jetbrains.kotlin.android" version "2.2.0" apply false', 1)
          settings.write_text(content)
          print("✅ settings.gradle 已修补")

          # 替换 build.gradle 中的 ext.kotlin_version
          build = Path('build.gradle')
          if build.exists():
              bcontent = build.read_text()
              bcontent = re.sub(r'ext\.kotlin_version\s*=\s*["\']([^"\']*)["\']',
                                'ext.kotlin_version = "2.2.0"', bcontent)
              build.write_text(bcontent)
              print("✅ build.gradle 已修补")

          # 替换 app/build.gradle 中的 Kotlin 插件版本，并添加 ndkVersion
          app = Path('app/build.gradle')
          if app.exists():
              acontent = app.read_text()
              acontent = re.sub(r'(id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+["\'])([^"\']+)(["\'])',
                                r'\g<1>2.2.0\g<3>', acontent)
              if 'ndkVersion' not in acontent:
                  acontent = acontent.replace('android {', 'android {\n    ndkVersion "28.2.13676358"')
              app.write_text(acontent)
              print("✅ app/build.gradle 已修补")
          PY

          # 添加 android.newDsl=false 避免 AGP 9 警告
          echo "android.newDsl=false" >> gradle.properties

          # 设置 SERIOUS_PYTHON_SITE_PACKAGES（扩大搜索范围）
          SITE_PACKAGES=$(find .. -type d -name "site-packages" 2>/dev/null | head -n 1)
          if [ -z "$SITE_PACKAGES" ]; then
            SITE_PACKAGES=$(find .. -type d -name ".serious_python" 2>/dev/null | head -n 1)
          fi
          if [ -z "$SITE_PACKAGES" ]; then
            echo "⚠️ 未找到 site-packages，使用系统 Python site-packages 作为回退"
            SITE_PACKAGES=$(python3 -c 'import site; print(site.getsitepackages()[0])')
          fi
          echo "SERIOUS_PYTHON_SITE_PACKAGES=$SITE_PACKAGES" >> $GITHUB_ENV

      - name: Build APK with Flutter directly
        run: |
          cd build/flutter
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-apk
          path: build/flutter/build/app/outputs/flutter-apk/app-release.apk
