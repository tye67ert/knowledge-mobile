name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Flet 0.80.0
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.80.0

      - name: Setup Flutter 3.38.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: stable

      - name: Set Flutter SDK path for Flet
        run: |
          echo "FLET_FLUTTER_SDK_PATH=${{ env.FLUTTER_ROOT }}" >> $GITHUB_ENV
          echo "FLUTTER_ROOT=${{ env.FLUTTER_ROOT }}" >> $GITHUB_ENV

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Build APK
        run: |
          flet build apk --project main.py --org com.knowledge

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-apk
          path: build/apk/*.apk
