name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.86.5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Set Flutter SDK path for Flet
        run: |
          echo "FLET_FLUTTER_SDK_PATH=${{ env.FLUTTER_ROOT }}" >> $GITHUB_ENV
          echo "FLUTTER_ROOT=${{ env.FLUTTER_ROOT }}" >> $GITHUB_ENV

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Generate Flet project (expected to fail at Gradle, ignore)
        run: |
          flet build apk --project main.py --org com.knowledge || true

      - name: Patch AGP, Kotlin, NDK versions and set SERIOUS_PYTHON_SITE_PACKAGES
        run: |
          cd build/flutter/android

          echo "=== 原始 settings.gradle 内容 ==="
          cat settings.gradle

          # 使用 Python 精确替换版本号
          python3 - <<'PY'
          import re
          from pathlib import Path

          # 处理 settings.gradle
          settings = Path('settings.gradle')
          content = settings.read_text()

          # 替换 AGP 版本（所有可能的旧版本）
          content = re.sub(r'(id\s+["\']com\.android\.application["\']\s+version\s+["\'])([^"\']+)(["\'])',
                           r'\g<1>8.9.1\g<3>', content)

          # 替换 Kotlin 版本
          content = re.sub(r'(id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+["\'])([^"\']+)(["\'])',
                           r'\g<1>2.2.0\g<3>', content)

          settings.write_text(content)
          print("=== 修改后的 settings.gradle 内容 ===")
          print(content)

          # 处理 build.gradle 中的 ext.kotlin_version
          build = Path('build.gradle')
          if build.exists():
              bcontent = build.read_text()
              bcontent = re.sub(r'ext\.kotlin_version\s*=\s*["\']([^"\']*)["\']',
                                'ext.kotlin_version = "2.2.0"', bcontent)
              build.write_text(bcontent)
              print("=== 修改后的 build.gradle 内容 ===")
              print(bcontent)

          # 处理 app/build.gradle 添加 ndkVersion
          app = Path('app/build.gradle')
          if app.exists():
              acontent = app.read_text()
              if 'ndkVersion' not in acontent:
                  acontent = acontent.replace('android {', 'android {\n    ndkVersion "28.2.13676358"')
              app.write_text(acontent)
              print("=== 修改后的 app/build.gradle 片段 ===")
              print(acontent[:600])
          PY

          # 添加 android.newDsl=false 避免 AGP 9 警告
          echo "android.newDsl=false" >> gradle.properties

          # 查找 site-packages 并设置环境变量
          SITE_PACKAGES=$(find .. -type d -name "site-packages" | head -n 1)
          if [ -z "$SITE_PACKAGES" ]; then
            SITE_PACKAGES=$(find .. -type d -name ".serious_python" | head -n 1)
          fi
          if [ -z "$SITE_PACKAGES" ]; then
            echo "❌ 未找到 site-packages 目录，列出目录内容："
            find .. -maxdepth 4 -type d | grep -i python | head -20
            exit 1
          fi
          echo "✅ 找到 site-packages: $SITE_PACKAGES"
          echo "SERIOUS_PYTHON_SITE_PACKAGES=$SITE_PACKAGES" >> $GITHUB_ENV

      - name: Build APK with Flutter directly
        run: |
          cd build/flutter
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-apk
          path: build/flutter/build/app/outputs/flutter-apk/app-release.apk
